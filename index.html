<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>DigitalGroup - Pro Max AI Chatbot</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- piexifjs for EXIF -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <!-- Leaflet for GeoTag map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JSZip for WebP batch download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-cyber {
            font-family: 'Space Grotesk', sans-serif;
        }

        html, body {
            margin: 0;
            height: 100%;
            background-color: #030014;
            color: #eef4ff;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        /* Nền Lưới Không Gian 3D Mesh Grid */
        .cyber-grid {
            background-image: 
                radial-gradient(circle at 20% 0%, #263b76 0, transparent 34%),
                radial-gradient(circle at 88% 8%, #541b72 0, transparent 28%),
                radial-gradient(circle at 50% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* Canvas Particle trong Navbar */
        #menu-particles-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Thanh Floating Navbar Shell */
        .promax-navbar {
            background: rgba(10, 10, 26, 0.65);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 20px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(112, 0, 255, 0.15),
                0 1px 0px rgba(255, 255, 255, 0.2) inset;
            transform-style: preserve-3d;
        }

        /* Spotlight Đèn Theo Dấu Chuột */
        .navbar-spotlight {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(168, 85, 247, 0.18), transparent 80%);
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        /* Wrapper Vật Lý Magnetic & Perspective 3D */
        .magnetic-wrap {
            position: relative;
            perspective: 1000px;
            z-index: 10;
        }

        .menu-item-card {
            position: relative;
            border-radius: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.15s cubic-bezier(0.1, 0.8, 0.2, 1), background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .magnetic-wrap:hover .menu-item-card {
            background: linear-gradient(135deg, var(--glow-start), var(--glow-end));
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px -10px var(--glow-aura), 0 0 25px var(--glow-aura), 0 0 12px rgba(255, 255, 255, 0.5) inset;
        }

        .light-streak {
            position: absolute;
            top: -50%; left: -150%;
            width: 80%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        .magnetic-wrap:hover .light-streak {
            animation: streakPass 0.8s ease forwards;
        }

        @keyframes streakPass {
            0% { left: -150%; }
            100% { left: 200%; }
        }

        .laser-border-beam {
            position: absolute;
            inset: -2px;
            border-radius: 1rem;
            padding: 2px;
            background: conic-gradient(from var(--beam-angle, 0deg) at 50% 50%, transparent 50%, var(--laser-color) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 5;
        }

        .magnetic-wrap:hover .laser-border-beam {
            opacity: 1;
            animation: spinBeam 1.8s linear infinite;
        }

        @property --beam-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes spinBeam {
            0% { --beam-angle: 0deg; }
            100% { --beam-angle: 360deg; }
        }

        .content-layer-3d {
            transform: translateZ(25px);
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .icon-pop-3d {
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .magnetic-wrap:hover .icon-pop-3d {
            transform: translateZ(35px) scale(1.25) rotate(-8deg);
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        /* Dropdown Mega-Menu */
        .mega-dropdown-panel {
            position: absolute;
            top: calc(100% + 16px);
            left: 50%;
            transform: translateX(-50%) rotateX(-15deg) scale(0.9) translateZ(-50px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(13, 12, 34, 0.92);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.2);
            border-radius: 1.5rem;
            transform-origin: top center;
            z-index: 100;
        }

        .magnetic-wrap:hover .mega-dropdown-panel {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) rotateX(0deg) scale(1) translateZ(0);
        }

        /* CTA Button Pro Max */
        .cta-promax-btn {
            position: relative;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            border-radius: 0.85rem;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 10px 25px -5px rgba(99, 102, 241, 0.6);
            transition: all 0.3s ease;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-promax-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.8), 0 15px 35px -5px rgba(168, 85, 247, 0.8);
        }

        .pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 1rem;
            border: 2px solid rgba(168, 85, 247, 0.6);
            animation: pulseGlow 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        /* CHAT LAYOUT STYLES */
        .app-container {
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px 12px 12px 12px;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            gap: 10px;
            max-width: 100vw;
            box-sizing: border-box;
        }

        .chat-layout {
            min-height: 0;
            flex: 1;
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 16px;
        }

        .panel, .chat-box {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 16, 34, 0.72);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
            overflow: hidden;
        }

        .panel { padding: 15px; }
        .new-btn {
            width: 100%; border: 0; border-radius: 13px; padding: 12px; color: #fff; font-weight: 800;
            background: linear-gradient(135deg, #655cff, #9b55ff);
            box-shadow: 0 10px 28px rgba(123, 82, 255, .3); cursor: pointer;
        }

        .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #71809d; margin: 21px 5px 9px; }
        .history-list { display: flex; flex-direction: column; gap: 5px; }
        .history-list button {
            background: transparent; border: 1px solid transparent; text-align: left; color: #b9c5dc;
            padding: 11px; border-radius: 11px; cursor: pointer; font-size: 12px;
        }
        .history-list button:hover, .history-list button.active {
            background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.07); color: #fff;
        }
        .history-list small { display: block; color: #65738e; margin-top: 3px; }

        .chat-box { display: flex; flex-direction: column; position: relative; }
        .chathead { padding: 15px 21px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; }
        .chathead strong { font-size: 14px; }
        .model-badge { font-size: 11px; color: #9fb0cc; padding: 6px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.08); }

        .messages { flex: 1; overflow: auto; padding: 24px 8%; display: flex; flex-direction: column; gap: 18px; }
        .msg { display: flex; gap: 11px; max-width: 800px; }
        .avatar { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, #10a37f, #1a7f64); font-size: 14px; }
        .bubble { line-height: 1.65; font-size: 14px; color: #d7e1f4; white-space: pre-wrap; word-break: break-word; }
        .user { align-self: flex-end; flex-direction: row-reverse; }
        .user .bubble { background: linear-gradient(135deg, #273a70, #493b86); padding: 12px 15px; border-radius: 17px 5px 17px 17px; color: #fff; }

        .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
        .chip { padding: 7px 12px; border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.035); border-radius: 999px; color: #aebbd3; font-size: 11px; cursor: pointer; transition: .2s; }
        .chip:hover { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(168,85,247,0.5); }

        .composer { padding: 14px 7%; border-top: 1px solid rgba(255,255,255,.08); background: rgba(3,7,18,.38); }
        .input-wrap { display: flex; align-items: center; gap: 9px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.055); padding: 8px 9px 8px 15px; border-radius: 16px; box-shadow: inset 0 1px rgba(255,255,255,.06); }
        .input-wrap input { flex: 1; background: none; border: 0; outline: 0; color: #fff; font-size: 13px; }
        .input-wrap input::placeholder { color: #64718c; }
        .tool-btn { border: 0; background: transparent; color: #8795b1; font-size: 18px; cursor: pointer; }
        .send-btn { width: 39px; height: 39px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #10a37f, #0d8a6a); color: white; cursor: pointer; box-shadow: 0 8px 20px rgba(16,163,127,.25); }
        .hint { text-align: center; color: #56647d; font-size: 9px; margin-top: 8px; }

        /* ===== TOOL PANELS ===== */
        #tool-jpg-panel, #tool-text-panel, #tool-geo-panel, #tool-replace-panel {
            display: none; flex: 1; overflow: auto; padding: 18px 20px; flex-direction: column;
        }
        #tool-jpg-panel.active, #tool-text-panel.active, #tool-geo-panel.active, #tool-replace-panel.active {
            display: flex;
        }

        /* CTA dropdown panel */
        .cta-wrap { position: relative; z-index: 120; }
        .cta-dropdown-panel {
            position: absolute; top: 100%; right: 0; min-width: 240px; padding-top: 10px;
            opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 200;
        }
        .cta-dropdown-inner {
            background: rgba(13, 12, 34, 0.97); backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(168, 85, 247, 0.2);
            border-radius: 1rem; padding: 8px;
        }
        .cta-wrap:hover .cta-dropdown-panel { opacity: 1; visibility: visible; pointer-events: auto; }
        .cta-menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
        }
        .cta-menu-item:hover { background: rgba(238, 17, 51, 0.12); border-color: rgba(238, 17, 51, 0.35); }
        .cta-menu-item .cta-icon {
            width: 32px; height: 32px; border-radius: 8px; background: rgba(238, 17, 51, 0.2); color: #ff6b81; display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .cta-menu-item h4 { font-size: 12px; font-weight: 700; color: #fff; margin: 0; }
        .cta-menu-item p { font-size: 10px; color: #94a3b8; margin: 2px 0 0; }

        @media(max-width:700px){
            html, body { overflow: auto; height: auto; min-height: 100dvh; }
            .app-container { height: auto; min-height: 100dvh; padding: 8px; }
            .chat-layout { grid-template-columns: 1fr; }
            .panel { display: none !important; }
            .messages { padding: 14px 12px; }
        }
    </style>
</head>

<!-- JAVASCRIPT LOGIC - KẾT NỐI CHATGPT (OPENAI API) -->
<script>
    // Điền API Key của OpenAI vào đây (Nếu chạy qua Worker/Proxy riêng có thể chỉnh OPENAI_API_URL)
    const OPENAI_API_KEY = 'YOUR_OPENAI_API_KEY'; 
    const OPENAI_API_URL = 'https://api.openai.com/v1/chat/completions';

    const messages = document.getElementById('messages');
    const input = document.getElementById('prompt');
    const send = document.getElementById('send');
    
    // Lịch sử trò chuyện theo chuẩn OpenAI API ({ role: 'user'|'assistant'|'system', content: string })
    let chatHistory = [
        { role: 'system', content: 'Bạn là một trợ lý AI hữu ích, thông minh và thân thiện.' }
    ];

    function addMessage(text, who = 'user') {
        const m = document.createElement('div');
        m.className = 'msg ' + (who === 'user' ? 'user' : '');
        m.innerHTML = `<div class="avatar">${who === 'user' ? 'Bạn' : '🤖'}</div><div class="bubble"></div>`;
        m.querySelector('.bubble').textContent = text;
        messages.appendChild(m);
        messages.scrollTop = messages.scrollHeight;
        return m;
    }

    async function callChatGPT(messagesPayload) {
        // Kiểm tra nếu chưa cấu hình API Key
        if (!OPENAI_API_KEY || OPENAI_API_KEY === 'YOUR_OPENAI_API_KEY') {
            throw new Error('Vui lòng cấu hình OPENAI_API_KEY trong file HTML!');
        }

        const response = await fetch(OPENAI_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}`
            },
            body: JSON.stringify({
                model: 'gpt-4o-mini', // Bạn có thể đổi sang 'gpt-4o' hoặc 'gpt-3.5-turbo'
                messages: messagesPayload,
                temperature: 0.7
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || 'Lỗi kết nối OpenAI API');
        }

        const text = data?.choices?.[0]?.message?.content;
        if (!text) {
            throw new Error('Không nhận được câu trả lời từ ChatGPT');
        }
        return text;
    }

    async function handleSend(userText = null) {
        const v = userText || input.value.trim();
        if (!v) return;

        addMessage(v, 'user');
        if (!userText) input.value = '';

        chatHistory.push({ role: 'user', content: v });

        const loadingMsg = addMessage('ChatGPT đang suy nghĩ...', 'ai');

        try {
            const aiReply = await callChatGPT(chatHistory);

            loadingMsg.querySelector('.bubble').textContent = aiReply;
            chatHistory.push({ role: 'assistant', content: aiReply });
        } catch (error) {
            console.error('ChatGPT API Error:', error);
            loadingMsg.querySelector('.bubble').textContent = `⚠️ ${error.message}`;
            chatHistory.pop(); // Xóa tin nhắn hỏng khỏi lịch sử
        }
    }

    window.sendSuggestion = function(text) {
        handleSend(text);
    };

    send.onclick = () => handleSend();
    input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

    document.getElementById('newChat').onclick = () => {
        chatHistory = [{ role: 'system', content: 'Bạn là một trợ lý AI hữu ích, thông minh và thân thiện.' }];
        messages.innerHTML = '<div class="msg"><div class="avatar">🤖</div><div class="bubble">Cuộc trò chuyện mới với ChatGPT đã sẵn sàng!</div></div>';
        input.focus();
    };

    window.showChatView = function() {
        document.querySelectorAll('#tool-jpg-panel, #tool-text-panel, #tool-geo-panel, #tool-replace-panel').forEach(p => p.classList.remove('active'));
    };
</script>
